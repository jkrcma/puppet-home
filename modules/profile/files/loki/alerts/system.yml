groups:
  - name: system
    rules:
      - alert: SyslogKernelErrors
        expr: sum(count_over_time({job="syslog",facility="kern",severity=~"alert|critical|error|warning"}[1m])) by (host) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Errors in kernel log (host {{ $labels.host }})
          description: "High severity log messages found in the kernel log\n  VALUE = {{ $value }}"

      - alert: SyslogKernelSDErrors
        expr: sum(count_over_time({job="syslog",facility="kern"} |= "FAILED Result"[1h])) by (host) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Errors in kernel log (host {{ $labels.host }})
          description: "Kernel SD subsystem errors found in logs\n  VALUE = {{ $value }}"

      - alert: SyslogSMARTErrors
        expr: sum(count_over_time({job="syslog",app="smartd",severity=~"alert|critical|error|warning"}[1m])) by (host) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: S.M.A.R.T errors in log (host {{ $labels.host }})
          description: "High severity smartd messages found in logs\n  VALUE = {{ $value }}"
