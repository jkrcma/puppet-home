[global]
   security = user
   workgroup = WORKGROUP
   server string = Drolf's Den NAS
   dns proxy = no
   log level = 1 passdb:2 auth:2
   log file = /var/log/samba/log.%m
   debug timestamp = yes
   max log size = 1000
   panic action = /usr/share/samba/panic-action %d
   server role = standalone server
   passdb backend = tdbsam
   obey pam restrictions = yes
   map to guest = bad user
   usershare allow guests = no
   mangled names = no
   load printers = no
   #
   # Performance tuning
   #
   smb encrypt = no
   client signing = no
   socket options = IPTOS_LOWDELAY IPTOS_THROUGHPUT TCP_NODELAY SO_SNDBUF=131072 SO_RCVBUF=131072 SO_KEEPALIVE
   min receivefile size = 16384
   use sendfile = true
   aio read size = 16384
   aio write size = 16384
   smb2 max read = 1048576
   smb2 max write = 1048576

[data]
   path = /data
   comment = NAS data pool
   writeable = yes
   inherit permissions = yes
   vfs objects = catia
   catia:mappings = 0x22:0xa8 0x3a:0x7e 0x3f:0x5e
